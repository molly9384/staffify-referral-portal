services:
  # ---- Backend: FastAPI + Python ----
  - type: web
    name: staffify-referral-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: staffify-referral-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      # Hubstaff integration
      - key: HUBSTAFF_API_TOKEN
        sync: false
      - key: HUBSTAFF_ORG_ID
        value: "699143"
      - key: HUBSTAFF_WEBHOOK_SECRET
        sync: false
      # QuickBooks Online integration
      - key: QBO_CLIENT_ID
        sync: false
      - key: QBO_CLIENT_SECRET
        sync: false
      - key: QBO_REDIRECT_URI
        sync: false
      - key: QBO_REALM_ID
        sync: false
      - key: QBO_ACCESS_TOKEN
        sync: false
      - key: QBO_REFRESH_TOKEN
        sync: false
      - key: QBO_ENVIRONMENT
        value: "production"
      # URLs
      - key: BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ---- Frontend: React + Vite (static site) ----
  - type: web
    name: staffify-referral-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  # ---- PostgreSQL (free tier) ----
  - name: staffify-referral-db
    databaseName: staffify_referral
    user: staffify
    region: oregon
    plan: starter
